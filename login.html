<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAE — Iniciar sesión</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="login-shell">
  <div class="login-brand">
    <div>
      <div class="login-brand-mark">PAE</div>
      <div class="login-brand-title">Plan Anual<br>de Entrenamiento</div>
      <div class="login-brand-sub">Seguimiento de asistencia, munición y tutorías del entrenamiento anual — División Tiro.</div>
    </div>
    <div class="login-brand-foot">División Tiro</div>
  </div>

  <div class="login-panel">
    <div class="login-card">
      <h1>Iniciar sesión</h1>
      <p class="hint">Ingresá con tu cuenta institucional.</p>

      <div class="login-error" id="loginError"></div>

      <form id="loginForm">
        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="username" required>
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primario" id="btnLogin">Ingresar</button>
      </form>
    </div>
  </div>
</div>

<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('btnLogin');
  const errorBox = document.getElementById('loginError');
  errorBox.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Ingresando...';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const res = await iniciarSesion(email, password);

  if (res.success) {
    window.location.href = 'index.html';
  } else {
    errorBox.textContent = res.error;
    errorBox.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Ingresar';
  }
});

// Si ya hay sesión activa, saltar directo al dashboard
(async function() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) window.location.href = 'index.html';
})();
</script>
</body>
</html>
